name: Build Hydra Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 6.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Restore Project Dependencies
      run: dotnet restore HydraMenu.sln

    - name: Compile Standalone Release DLL
      run: dotnet build HydraMenu.sln -c Release /p:GenerateInteropAssemblies=false

    - name: Upload Compiled BepInEx Plugin
      uses: actions/upload-artifact@v4
      with:
        name: HydraMenu-Compiled-Plugin
        path: |
          **/bin/Release/net6.0/*.dll
          !**/bin/Release/net6.0/*.pdb
